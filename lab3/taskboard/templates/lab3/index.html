{% load static %}
<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TaskBoard - Lista zadań</title>

    <link rel="stylesheet" href="{% static 'lab3/style.css' %}">
    <script src="{% static 'lab3/script.js' %}" defer></script>

</head>

<body>

    <main class="container">

        <header>
            <h1>TaskBoard</h1>
            <p>Aplikacja do zarządzania zadaniami</p>
        </header>

        <!-- Formularz dodawania zadania -->
        <section class="task-form-section">
            <h2>Dodaj nowe zadanie</h2>

            <form id="task-form">

                {% csrf_token %}

                <label for="task-title">Treść zadania:</label>

                <div class="form-row">
                    <input
                        type="text"
                        id="task-title"
                        name="title"
                        placeholder="Wpisz treść zadania..."
                        maxlength="200"
                    >

                    <button type="submit" id="add-task">
                        Dodaj
                    </button>
                </div>
            </form>

            <p id="message" class="message" role="status" aria-live="polite"></p>
        </section>

        <!-- Podsumowanie zadań -->
        <section class="summary">
            <h2>Podsumowanie</h2>

            <p>Wszystkie zadania: <strong id="total-count">0</strong></p>
            <p>Ukończone zadania: <strong id="completed-count">0</strong></p>
        </section>

        <!-- Przyciski filtrowania -->
        <section class="filters">
            <h2>Filtruj zadania</h2>

            <div class="filter-buttons">
                <button type="button" class="filter-btn active" data-filter="all">
                    Wszystkie
                </button>

                <button type="button" class="filter-btn" data-filter="active">
                    Nieukończone
                </button>

                <button type="button" class="filter-btn" data-filter="completed">
                    Ukończone
                </button>
            </div>
        </section>

        <!-- Lista zadań -->
        <section class="task-list-section">
            <h2>Lista zadań</h2>

            <ul id="task-list"></ul>
        </section>

    </main>

</body>
</html>
